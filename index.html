<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Matematik Iman Syaddad</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Comic Sans MS', 'Comic Neue', 'Chalkboard SE', 'Arial', sans-serif;
      background-color: #f0fdf4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      text-align: center;
      width: 350px;
      min-height: 450px; 
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      color: #15803d;
      margin-bottom: 15px;
      background: #dcfce7;
      padding: 8px 15px;
      border-radius: 12px;
    }

    .mode-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
    }

    .btn-mode {
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 15px;
      border: none;
      color: white;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .btn-mode:hover { transform: scale(1.03); }
    .btn-minus { background-color: #ef4444; }
    .btn-plus { background-color: #3b82f6; }
    .btn-mix { background-color: #8b5cf6; }

    .math-grid {
      display: grid;
      grid-template-columns: 60px 80px 80px;
      font-size: 36px;
      font-weight: bold;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
    }

    .header-label {
      font-size: 18px;
      color: #888;
      border-bottom: 2px solid #ddd;
      padding-bottom: 5px;
    }

    .strike {
      text-decoration: line-through;
      color: #ef4444;
    }

    .new-num {
      color: #16a34a;
      font-size: 28px;
      position: absolute;
      top: -25px;
    }

    .temp-num {
      color: #f97316;
      font-size: 22px;
      position: absolute;
      top: 38px;
      left: 5px;
    }

    .line {
      grid-column: span 3;
      border-bottom: 4px solid #333;
      margin: 10px 0;
    }

    button.btn-action {
      background-color: #16a34a;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
    }

    button.btn-action:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    input.name-box {
      font-size: 18px;
      width: 80%;
      text-align: center;
      padding: 8px;
      border-radius: 10px;
      border: 2px solid #8b5cf6;
      margin-bottom: 10px;
      font-weight: bold;
      color: #6b21a8;
    }

    .result-score {
      font-size: 55px;
      font-weight: bold;
      color: #16a34a;
      margin: 10px 0;
    }

    #instruction {
      min-height: 42px;
      transition: none;
    }

    /* STAIL BUTANG PETAK SEGI EMPAT SAMA */
    .options-container {
      display: flex;
      flex-direction: row; 
      gap: 20px;
      margin-top: 25px;
      justify-content: center; 
    }

    .btn-option {
      width: 90px;  
      height: 90px; 
      font-size: 32px;
      font-weight: bold;
      border-radius: 18px;
      border: 4px solid #16a34a;
      background-color: #dcfce7;
      color: #15803d;
      cursor: pointer;
      display: flex; 
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-option:hover:not(:disabled) { 
      background-color: #bbf7d0; 
      transform: scale(1.05); 
    }

    .btn-option:disabled { 
      cursor: not-allowed; 
      opacity: 0.7; 
    }

    .btn-option.correct {
      background-color: #16a34a;
      color: white;
      border-color: #16a34a;
    }

    .btn-option.wrong {
      background-color: #ef4444;
      color: white;
      border-color: #ef4444;
    }

    .demo-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-skip {
      background-color: #f97316;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
    }

    #quiz-question {
      font-size: 42px; 
      font-weight: bold; 
      color: #333; 
      margin: 30px 0 10px 0;
      min-height: 50px;
    }

    /* STAIL KAD FLIP MESEJ */
    .card-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .flip-card {
      perspective: 1000px;
      width: 220px;
      height: 280px;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }

    .flip-card-inner.flipped {
      transform: rotateY(180deg);
    }

    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 4px solid rgba(255,255,255,0.55);
      text-align: center;
      padding: 15px;
      box-sizing: border-box;
    }

    .flip-card-front {
      background: linear-gradient(160deg, #6d28d9, #1e1b4b);
    }

    .flip-card-back {
      transform: rotateY(180deg);
    }
    
    .card-back-text {
      font-size: 18px;
      font-weight: bold;
      line-height: 1.4;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2 id="title" style="color: #15803d; margin-top: 0;">Detektif Matematik! 🔍</h2>
    <p id="instruction">Masukkan nama & pilih mod permainan:</p>

    <div id="mode-menu">
      <input type="text" id="player-name" class="name-box" value="Iman Syaddad" placeholder="Masukkan Nama">
      <div class="mode-container">
        <button class="btn-mode btn-minus" onclick="selectMode('minus')">➖ Mod Tolak Sahaja</button>
        <button class="btn-mode btn-plus" onclick="selectMode('plus')">➕ Mod Tambah Sahaja</button>
        <button class="btn-mode btn-mix" onclick="selectMode('mix')">🔀 Mod Campur (Tambah & Tolak)</button>
      </div>
    </div>

    <div id="demo-section" style="display: none;">
      <div class="math-grid" id="math-box">
        <div></div>
        <div class="header-label">Puluh</div>
        <div class="header-label">Sa</div>
        <div></div>
        <div style="position: relative;">
          <span id="p-indicator" class="new-num" style="opacity:0; left:25px;"></span>
          <span id="num-p-top">3</span>
        </div>
        <div style="position: relative;">
          <span id="s-indicator" class="new-num" style="opacity:0; left:15px;"></span>
          <span id="temp-s" class="temp-num" style="opacity:0;">12</span>
          <span id="num-s-top">5</span>
        </div>
        <div id="op-symbol">-</div>
        <div id="num-p-bottom">2</div>
        <div id="num-s-bottom">6</div>
        <div class="line"></div>
        <div></div>
        <div id="ans-p" style="opacity:0;">0</div>
        <div id="ans-s" style="opacity:0;">9</div>
      </div>

      <div class="demo-buttons">
        <button id="main-btn" class="btn-action" onclick="startDemo()">Tunjukkan Contoh</button>
        <button id="skip-btn" class="btn-skip" onclick="showQuiz()">Langsung Mula Kuiz ⏩</button>
      </div>
    </div>

    <div id="quiz-section" style="display: none;">
      <div class="status-bar">
        <span id="q-tracker">Soalan: 1/10</span>
        <span id="score-tracker">Markah: 0</span>
      </div>

      <div id="quiz-math-grid" class="math-grid" style="display: none; margin: 10px auto;">
        <div></div>
        <div class="header-label">Puluh</div>
        <div class="header-label">Sa</div>
        <div></div>
        <div id="qz-num-p-top">0</div>
        <div id="qz-num-s-top">0</div>
        <div id="qz-op-symbol">-</div>
        <div id="qz-num-p-bottom">0</div>
        <div id="qz-num-s-bottom">0</div>
        <div class="line"></div>
      </div>

      <p id="quiz-question" style="display: none;"></p>
      
      <div id="options-container" class="options-container" style="display: none;">
        <button class="btn-option" id="opt1" onclick="checkAnswer(this)"></button>
        <button class="btn-option" id="opt2" onclick="checkAnswer(this)"></button>
      </div>

      <p id="feedback" style="font-size: 16px; font-weight: bold; min-height: 45px; margin-top: 15px;"></p>

      <div id="quiz-working" style="display:none;">
        <p style="font-size:14px;color:#6b21a8;font-weight:bold;margin:10px 0 4px;">Jalan kerja betul:</p>
        <div class="math-grid" id="quiz-math-box">
          <div></div>
          <div class="header-label">Puluh</div>
          <div class="header-label">Sa</div>
          <div></div>
          <div style="position: relative;">
            <span id="q-p-indicator" class="new-num" style="opacity:0; left:25px;"></span>
            <span id="q-num-p-top">0</span>
          </div>
          <div style="position: relative;">
            <span id="q-s-indicator" class="new-num" style="opacity:0; left:15px;"></span>
            <span id="q-temp-s" class="temp-num" style="opacity:0;"></span>
            <span id="q-num-s-top">0</span>
          </div>
          <div id="q-op-symbol">-</div>
          <div id="q-num-p-bottom">0</div>
          <div id="q-num-s-bottom">0</div>
          <div class="line"></div>
          <div></div>
          <div id="q-ans-p" style="opacity:0;">0</div>
          <div id="q-ans-s" style="opacity:0;">0</div>
        </div>
        <p id="working-instr" style="font-size:14px; color:#555; min-height:38px; margin: 6px 0;"></p>
        <button class="btn-action" id="next-q-btn" style="display:none;" onclick="proceedAfterWorking()">Soalan Seterusnya ➡️</button>
      </div>

      <button class="btn-action" style="background-color: #9ca3af; font-size: 13px; padding: 8px 16px; margin-top: 10px;" onclick="exitQuiz()">⬅️ Keluar / Tukar Mod</button>
    </div>

    <div id="result-section" style="display: none;">
      <div style="font-size: 40px;" id="star-display">⭐⭐⭐</div>
      <p style="font-size: 18px; color: #555;">MARKAH KESELURUHAN (10 Soalan):</p>
      <div class="result-score" id="final-percentage">100%</div>
      <p id="final-msg" style="font-size: 18px; font-weight: bold; color: #15803d;"></p>
      <button class="btn-action" onclick="goHome()">Tukar Mod / Main Lagi 🔄</button>
    </div>
  </div>

  <!-- KAD FLIP MESEJ PUJIAN & GALAKAN -->
  <div id="card-modal" class="card-modal-backdrop">
    <div class="flip-card">
      <div class="flip-card-inner" id="flip-card-inner">
        <div class="flip-card-front">
          <div style="font-size:50px;">🎴</div>
          <div style="font-size:16px; margin-top:10px; font-weight:bold;">Mesej Untuk Anda...</div>
        </div>
        <div class="flip-card-back" id="flip-card-back">
          <div id="card-emoji" style="font-size:50px;"></div>
          <div id="card-message" class="card-back-text"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let playerName = "Iman Syaddad";
    let currentAns = 0;
    let currentQuestion = 0;
    let totalQuestions = 10;
    let score = 0;
    let selectedMode = 'mix';
    let currentOperator = '-';
    let isSpecialCase = false;
    let currentNum1 = 0;
    let currentNum2 = 0;
    let attemptCount = 0; 

    // --- SENARAI MESEJ & EMOJI ---
    const correctMessages = [
      "TAHNIAH #NAME#! ANDA HEBAT!",
      "WAH #NAME#! PANDAINYA!",
      "BETUL #NAME#! TERUSKAN!",
      "#NAME# MEMANG GENIUS!",
      "MASYUKK #NAME#! STAR!",
      "HEBAT #NAME#! PUAS HATI!"
    ];
    const correctEmojis = ["🎉", "🌟", "🚀", "💡", "⭐", "💯"];

    const incorrectMessages = [
      "TAKPE #NAME#, CUBA LAGI!",
      "#NAME# BOLEH, CUBA SEKALI LAGI!",
      "HAMPIR #NAME#! CUBA LAGI YA!",
      "JANGAN GELISAH #NAME#, CUBA LAGI!",
      "SALAH SIKIT JE #NAME#, TRY AGAIN!"
    ];
    const incorrectEmojis = ["💪", "😊", "🤔", "🌈", "✨"];

    let demoQueue = [];
    let demoIdx = 0;

    function selectMode(mode) {
      let inputName = document.getElementById('player-name').value.trim();
      if (inputName !== "") {
        playerName = inputName.toUpperCase();
      }
      selectedMode = mode;
      document.getElementById('mode-menu').style.display = "none";
      document.getElementById('demo-section').style.display = "block";
      document.getElementById('instruction').style.display = "block";

      if (mode === 'minus') {
        demoQueue = ['minus-borrow', 'minus-noborrow'];
        document.getElementById('instruction').innerText = "Tekan butang untuk lihat contoh tolak:";
      } else if (mode === 'plus') {
        demoQueue = ['plus-carry'];
        document.getElementById('instruction').innerText = "Tekan butang untuk lihat contoh tambah:";
      } else {
        demoQueue = ['minus-borrow', 'minus-noborrow', 'plus-carry'];
        document.getElementById('instruction').innerText = "Mod Campur: kita mula dengan contoh tolak dulu.";
      }
      demoIdx = 0;
      const btn = document.getElementById('main-btn');
      btn.disabled = false;
      btn.onclick = startDemo;
      btn.innerText = demoLabel(demoQueue[0]);
      document.getElementById('skip-btn').disabled = false;
      setupDemoBoard(demoQueue[0]);
    }

    function demoLabel(kind) {
      if (kind === 'minus-borrow') return "Tunjukkan Contoh (35 - 26)";
      if (kind === 'minus-noborrow') return "Tunjukkan Contoh (58 - 23)";
      return "Tunjukkan Contoh (27 + 15)";
    }

    function setupDemoBoard(kind) {
      const pIndicator = document.getElementById('p-indicator');
      const sIndicator = document.getElementById('s-indicator');
      const tempS = document.getElementById('temp-s');
      const ansP = document.getElementById('ans-p');
      const ansS = document.getElementById('ans-s');
      const numPTop = document.getElementById('num-p-top');
      const numSTop = document.getElementById('num-s-top');

      gsap.killTweensOf([pIndicator, sIndicator, tempS, ansP, ansS, numPTop, numSTop]);
      gsap.set([pIndicator, sIndicator, tempS, ansP, ansS], { opacity: 0, scale: 1 });
      numPTop.classList.remove('strike'); numSTop.classList.remove('strike');
      numPTop.style.color = ""; numSTop.style.color = "";
      pIndicator.innerText = ""; sIndicator.innerText = ""; tempS.innerText = "";

      if (kind === 'minus-borrow') {
        document.getElementById('op-symbol').innerText = "-";
        numPTop.innerText = "3"; numSTop.innerText = "5";
        document.getElementById('num-p-bottom').innerText = "2";
        document.getElementById('num-s-bottom').innerText = "6";
        ansP.innerText = "0"; ansS.innerText = "9";
        pIndicator.innerText = "2"; sIndicator.innerText = "15";
      } else if (kind === 'minus-noborrow') {
        document.getElementById('op-symbol').innerText = "-";
        numPTop.innerText = "5"; numSTop.innerText = "8";
        document.getElementById('num-p-bottom').innerText = "2";
        document.getElementById('num-s-bottom').innerText = "3";
        ansP.innerText = "3"; ansS.innerText = "5";
      } else {
        document.getElementById('op-symbol').innerText = "+";
        numPTop.innerText = "2"; numSTop.innerText = "7";
        document.getElementById('num-p-bottom').innerText = "1";
        document.getElementById('num-s-bottom').innerText = "5";
        ansP.innerText = "4"; ansS.innerText = "2";
        pIndicator.innerText = "1"; tempS.innerText = "12";
      }
    }

    function startDemo() {
      const kind = demoQueue[demoIdx];
      const runFn = kind === 'plus-carry' ? runPlusDemo : kind === 'minus-borrow' ? runMinusBorrowDemo : runMinusNoBorrowDemo;
      runFn(() => {
        demoIdx++;
        if (demoIdx < demoQueue.length) {
          setupDemoBoard(demoQueue[demoIdx]);
          const btn = document.getElementById('main-btn');
          btn.disabled = false;
          btn.innerText = "Seterusnya: " + demoLabel(demoQueue[demoIdx]) + " ➡️";
          btn.onclick = startDemo;
        } else { finishDemos(); }
      });
    }

    function finishDemos() {
      const btn = document.getElementById('main-btn');
      btn.disabled = false;
      btn.innerText = "Mula Soalan Latihan! 🚀";
      btn.onclick = showQuiz;
      document.getElementById('instruction').innerText = `Sedia ${playerName}? Perhatikan SIMBOL (+ atau -) dulu!`;
      document.getElementById('skip-btn').style.display = "none";
    }

    function runMinusBorrowDemo(onDone) {
      const instr = document.getElementById('instruction');
      document.getElementById('main-btn').disabled = true;
      instr.innerText = "Mari lihat: 35 - 26";
      let tl = gsap.timeline({ onComplete: onDone });
      tl.call(() => { instr.innerText = "Lajur Sa: 5 kecil dari 6. Tak boleh tolak terus!"; })
        .to({}, { duration: 1.6 }).to("#num-p-top", { duration: 1.0, color: "#ef4444" })
        .call(() => { instr.innerText = "Kita PINJAM 1 dari lajur Puluh (3 jadi 2)."; })
        .to("#num-p-top", { duration: 0.6, onStart: () => document.getElementById('num-p-top').classList.add('strike') })
        .to("#p-indicator", { duration: 1.0, opacity: 1, y: 5 }).to({}, { duration: 1.2 })
        .call(() => { instr.innerText = "1 yang dipinjam jadi 10, digabung dgn 5 = 15."; })
        .to("#num-s-top", { duration: 1.0, color: "#ef4444" })
        .to("#num-s-top", { duration: 0.6, onStart: () => document.getElementById('num-s-top').classList.add('strike') })
        .to("#s-indicator", { duration: 1.0, opacity: 1, y: 5 }).to({}, { duration: 1.4 })
        .call(() => { instr.innerText = "Sekarang kira: 15 - 6 = 9"; })
        .to("#ans-s", { duration: 1.2, opacity: 1, color: "#16a34a", scale: 1.2 }).to("#ans-s", { duration: 0.3, scale: 1 }).to({}, { duration: 1.4 })
        .call(() => { instr.innerText = "Kemudian kira: 2 - 2 = 0"; })
        .to("#ans-p", { duration: 1.2, opacity: 1, color: "#16a34a", scale: 1.2 }).to("#ans-p", { duration: 0.3, scale: 1 }).to({}, { duration: 1.4 })
        .call(() => { instr.innerText = "Jawapan akhir: 35 - 26 = 09"; }).to({}, { duration: 1.6 });
    }

    function runMinusNoBorrowDemo(onDone) {
      const instr = document.getElementById('instruction');
      document.getElementById('main-btn').disabled = true;
      instr.innerText = "Sekarang contoh lain: 58 - 23";
      let tl = gsap.timeline({ onComplete: onDone });
      tl.call(() => { instr.innerText = "Lajur Sa: 8 lebih besar dari 3. Boleh tolak terus!"; })
        .to({}, { duration: 1.6 }).call(() => { instr.innerText = "Kali ini TAK PERLU pinjam dari Puluh."; }).to({}, { duration: 1.6 })
        .call(() => { instr.innerText = "Kira lajur Sa: 8 - 3 = 5"; })
        .to("#ans-s", { duration: 1.2, opacity: 1, color: "#16a34a", scale: 1.2 }).to("#ans-s", { duration: 0.3, scale: 1 }).to({}, { duration: 1.4 })
        .call(() => { instr.innerText = "Kira lajur Puluh: 5 - 2 = 3"; })
        .to("#ans-p", { duration: 1.2, opacity: 1, color: "#16a34a", scale: 1.2 }).to("#ans-p", { duration: 0.3, scale: 1 }).to({}, { duration: 1.4 })
        .call(() => { instr.innerText = "Jawapan akhir: 58 - 23 = 35"; }).to({}, { duration: 1.6 });
    }

    function runPlusDemo(onDone) {
      const instr = document.getElementById('instruction');
      document.getElementById('main-btn').disabled = true;
      instr.innerText = "Mari lihat: 27 + 15";
      let tl = gsap.timeline({ onComplete: onDone });
      tl.call(() => { instr.innerText = "Lajur Sa: 7 + 5 = 12. Lebih dari 9!"; })
        .to({}, { duration: 1.6 }).to("#temp-s", { duration: 1.0, opacity: 1 }).to({}, { duration: 1.4 })
        .call(() => { instr.innerText = "Kita SIMPAN angka 1 ke lajur Puluh, tulis 2 di Sa."; })
        .to("#temp-s", { duration: 0.8, opacity: 0 }).to("#p-indicator", { duration: 1.0, opacity: 1, color: "#16a34a", y: 5 })
        .to("#ans-s", { duration: 1.0, opacity: 1, color: "#16a34a", scale: 1.2 }).to("#ans-s", { duration: 0.3, scale: 1 }).to({}, { duration: 1.4 })
        .call(() => { instr.innerText = "Lajur Puluh: 2 + 1 + 1 (simpanan) = 4"; })
        .to("#ans-p", { duration: 1.2, opacity: 1, color: "#16a34a", scale: 1.2 }).to("#ans-p", { duration: 0.3, scale: 1 }).to({}, { duration: 1.4 })
        .call(() => { instr.innerText = "Jawapan akhir: 27 + 15 = 42"; }).to({}, { duration: 1.6 });
    }

    function showQuiz() {
      gsap.globalTimeline.clear(); 
      document.getElementById('demo-section').style.display = "none";
      document.getElementById('mode-menu').style.display = "none";
      document.getElementById('title').innerText = "Cabaran Matematik";
      document.getElementById('instruction').style.display = "none";
      document.getElementById('quiz-section').style.display = "block";
      document.getElementById('quiz-working').style.display = "none";
      document.getElementById('next-q-btn').style.display = "none";
      currentQuestion = 0;
      score = 0;
      nextQuestion();
    }

    function generateOptions(correctAns) {
      let options = [correctAns];
      while (options.length < 2) {
        let offset = Math.floor(Math.random() * 10) + 1;
        let wrongAns = correctAns + (Math.random() < 0.5 ? offset : -offset);
        if (wrongAns < 0) wrongAns = correctAns + offset;
        if (!options.includes(wrongAns)) options.push(wrongAns);
      }
      return options.sort(() => Math.random() - 0.5);
    }

    function nextQuestion() {
      if (currentQuestion < totalQuestions) {
        currentQuestion++;
        attemptCount = 0; 
        
        document.getElementById('q-tracker').innerText = `Soalan: ${currentQuestion}/${totalQuestions}`;
        document.getElementById('score-tracker').innerText = `Markah: ${score * 10}`;
        document.getElementById('feedback').innerText = '';
        
        const optBtns = document.querySelectorAll('.btn-option');
        optBtns.forEach(btn => {
          btn.disabled = false;
          btn.classList.remove('correct', 'wrong');
          btn.style.backgroundColor = ''; 
          btn.style.color = '';
          btn.style.borderColor = '';
        });

        if (selectedMode === 'plus') currentOperator = '+';
        else if (selectedMode === 'minus') currentOperator = '-';
        else currentOperator = Math.random() < 0.5 ? '+' : '-';

        let num1, num2;
        let p = Math.floor(Math.random() * 4) + 2; 

        if (currentOperator === '+') {
          isSpecialCase = Math.random() < 0.5; 
          let s1 = Math.floor(Math.random() * 5) + 3;
          let s2 = isSpecialCase ? (Math.floor(Math.random() * 4) + 7 - s1) : Math.floor(Math.random() * (9 - s1));
          num1 = (p * 10) + s1;
          num2 = (Math.floor(Math.random() * 3) + 1) * 10 + s2;
          currentAns = num1 + num2;
        } else {
          isSpecialCase = Math.random() < 0.5; 
          if (isSpecialCase) {
            let s1 = Math.floor(Math.random() * 4);      
            let s2 = Math.floor(Math.random() * 5) + 5;   
            num1 = (p * 10) + s1;
            num2 = (Math.floor(Math.random() * (p - 1)) + 1) * 10 + s2;
          } else {
            let s1 = Math.floor(Math.random() * 5) + 4;   
            let s2 = Math.floor(Math.random() * 4);      
            num1 = (p * 10) + s1;
            num2 = (Math.floor(Math.random() * (p - 1)) + 1) * 10 + s2;
          }
          currentAns = num1 - num2;
        }

        currentNum1 = num1;
        currentNum2 = num2;

        let p1 = Math.floor(num1 / 10), s1 = num1 % 10;
        let p2 = Math.floor(num2 / 10), s2 = num2 % 10;

        document.getElementById('qz-num-p-top').innerText = p1;
        document.getElementById('qz-num-s-top').innerText = s1;
        document.getElementById('qz-op-symbol').innerText = currentOperator;
        document.getElementById('qz-num-p-bottom').innerText = p2;
        document.getElementById('qz-num-s-bottom').innerText = s2;

        document.getElementById('quiz-question').innerText = `${num1} ${currentOperator} ${num2} = ?`;
        document.getElementById('quiz-question').style.display = "none";
        document.getElementById('options-container').style.display = "none";
        document.getElementById('quiz-working').style.display = "none";

        let tl = gsap.timeline();
        tl.to("#quiz-math-grid", {display: "grid", opacity: 1, duration: 0})
          .from("#quiz-math-grid", {y: -20, opacity: 0, duration: 0.5})
          .to({}, {duration: 2.0}) 
          .to("#quiz-math-grid", {opacity: 0, y: 20, duration: 0.5, onComplete: () => {
             document.getElementById('quiz-math-grid').style.display = "none";
          }})
          .call(() => { document.getElementById('quiz-question').style.display = "block"; })
          .from("#quiz-question", {opacity: 0, y: -20, duration: 0.5})
          .call(() => { document.getElementById('options-container').style.display = "flex"; })
          .from(".btn-option", {opacity: 0, scale: 0.5, stagger: 0.15, duration: 0.3, ease: "back.out(2)"});

        let options = generateOptions(currentAns);
        document.getElementById('opt1').innerText = options[0];
        document.getElementById('opt2').innerText = options[1];

      } else {
        showResults();
      }
    }

    function checkAnswer(btn) {
      let input = parseInt(btn.innerText, 10);
      let feedback = document.getElementById('feedback');
      let firstName = playerName.split(' ')[0]; 

      if (input === currentAns) {
        score++;
        btn.classList.add('correct');
        document.querySelectorAll('.btn-option').forEach(b => b.disabled = true);
        
        let randomMsg = correctMessages[Math.floor(Math.random() * correctMessages.length)].replace('#NAME#', firstName);
        let randomEmoji = correctEmojis[Math.floor(Math.random() * correctEmojis.length)];
        
        showFlipCard(randomMsg, randomEmoji, 'correct', () => {
          setTimeout(nextQuestion, 200);
        });
        
      } else {
        attemptCount++;
        btn.classList.add('wrong');
        btn.disabled = true; 

        if (attemptCount === 1) {
          let randomMsg = incorrectMessages[Math.floor(Math.random() * incorrectMessages.length)].replace('#NAME#', firstName);
          let randomEmoji = incorrectEmojis[Math.floor(Math.random() * incorrectEmojis.length)];
          
          showFlipCard(randomMsg, randomEmoji, 'wrong', () => {
            // Biarkan dia cuba butang yang satu lagi
          });
        } else {
          document.querySelectorAll('.btn-option').forEach(b => {
            b.disabled = true;
            if (parseInt(b.innerText, 10) === currentAns) b.classList.add('correct');
          });
          feedback.style.color = "#ef4444";
          feedback.innerText = `Jawapan sebenar ialah ${currentAns}. Jom lihat jalan kerjanya:`;
          showWorkingDemo();
        }
      }
    }

    // FUNGSI KAD FLIP MESEJ
    function showFlipCard(msg, emoji, type, onDone) {
      document.getElementById('card-emoji').innerText = emoji;
      document.getElementById('card-message').innerText = msg;
      
      const backCard = document.getElementById('flip-card-back');
      if (type === 'correct') {
        backCard.style.background = 'linear-gradient(160deg, #16a34a, #052e16)'; // Hijau
      } else {
        backCard.style.background = 'linear-gradient(160deg, #f97316, #431407)'; // Oren
      }

      const inner = document.getElementById('flip-card-inner');
      inner.classList.remove('flipped');
      void inner.offsetWidth; 

      const modal = document.getElementById('card-modal');
      modal.style.display = "flex";
      
      // Animasi masuk
      gsap.fromTo(modal, {opacity: 0}, {opacity: 1, duration: 0.3});
      gsap.fromTo(".flip-card", {scale: 0.5, rotation: -10}, {scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2)"});

      setTimeout(() => { inner.classList.add('flipped'); }, 600);

      setTimeout(() => {
        gsap.to(".flip-card", {scale: 0, opacity: 0, duration: 0.4, ease: "back.in(2)", onComplete: () => {
          modal.style.display = "none";
          gsap.set(".flip-card", {scale: 1, opacity: 1}); // reset untuk kegunaan akan datang
          if (onDone) onDone();
        }});
      }, 2500);
    }

    function showWorkingDemo() {
      document.getElementById('quiz-math-grid').style.display = "none";
      document.getElementById('quiz-question').style.display = "none";
      document.getElementById('options-container').style.display = "none";
      document.getElementById('next-q-btn').style.display = "none";
      document.getElementById('quiz-working').style.display = "block";

      runWorkingDemo(currentNum1, currentNum2, currentOperator, () => {
        document.getElementById('next-q-btn').style.display = "inline-block";
      });
    }

    function proceedAfterWorking() {
      document.getElementById('quiz-working').style.display = "none";
      document.getElementById('quiz-question').style.display = "block";
      document.getElementById('options-container').style.display = "flex";
      nextQuestion();
    }

    function runWorkingDemo(num1, num2, operator, onDone) {
      const instr = document.getElementById('working-instr');
      const qP = document.getElementById('q-num-p-top');
      const qS = document.getElementById('q-num-s-top');
      const qPB = document.getElementById('q-num-p-bottom');
      const qSB = document.getElementById('q-num-s-bottom');
      const qOp = document.getElementById('q-op-symbol');
      const qAnsP = document.getElementById('q-ans-p');
      const qAnsS = document.getElementById('q-ans-s');
      const qPInd = document.getElementById('q-p-indicator');
      const qSInd = document.getElementById('q-s-indicator');
      const qTempS = document.getElementById('q-temp-s');

      gsap.killTweensOf([qP, qS, qAnsP, qAnsS, qPInd, qSInd, qTempS]);
      gsap.set([qAnsP, qAnsS, qPInd, qSInd, qTempS], { opacity: 0, scale: 1 });
      qP.classList.remove('strike'); qS.classList.remove('strike');
      qP.style.color = ""; qS.style.color = "";
      qPInd.innerText = ""; qSInd.innerText = ""; qTempS.innerText = "";

      let p1 = Math.floor(num1 / 10), s1 = num1 % 10;
      let p2 = Math.floor(num2 / 10), s2 = num2 % 10;
      qOp.innerText = operator; qP.innerText = p1; qS.innerText = s1;
      qPB.innerText = p2; qSB.innerText = s2;

      let tl = gsap.timeline({ onComplete: onDone });

      if (operator === '+') {
        let sSum = s1 + s2;
        if (sSum >= 10) {
          let onesDigit = sSum - 10; let ansP = p1 + p2 + 1;
          qAnsS.innerText = onesDigit; qAnsP.innerText = ansP;
          qPInd.innerText = "1"; qTempS.innerText = sSum;
          tl.call(() => { instr.innerText = `Lajur Sa: ${s1} + ${s2} = ${sSum}. Lebih dari 9!`; })
            .to({}, { duration: 1.4 }).to(qTempS, { duration: 0.8, opacity: 1 }).to({}, { duration: 1.2 })
            .call(() => { instr.innerText = `Simpan 1 ke Puluh, tulis ${onesDigit} di Sa.`; })
            .to(qTempS, { duration: 0.6, opacity: 0 }).to(qPInd, { duration: 0.8, opacity: 1, color: "#16a34a", y: 5 })
            .to(qAnsS, { duration: 0.8, opacity: 1, color: "#16a34a", scale: 1.2 }).to(qAnsS, { duration: 0.2, scale: 1 }).to({}, { duration: 1.2 })
            .call(() => { instr.innerText = `Lajur Puluh: ${p1} + ${p2} + 1 (simpanan) = ${ansP}`; })
            .to(qAnsP, { duration: 1.0, opacity: 1, color: "#16a34a", scale: 1.2 }).to(qAnsP, { duration: 0.2, scale: 1 }).to({}, { duration: 1.2 })
            .call(() => { instr.innerText = `Jawapan akhir: ${num1} + ${num2} = ${num1 + num2}`; }).to({}, { duration: 1.4 });
        } else {
          let ansP = p1 + p2; qAnsS.innerText = sSum; qAnsP.innerText = ansP;
          tl.call(() => { instr.innerText = `Lajur Sa: ${s1} + ${s2} = ${sSum}. Tak lebih 9, terus tulis.`; })
            .to({}, { duration: 1.4 }).to(qAnsS, { duration: 1.0, opacity: 1, color: "#16a34a", scale: 1.2 }).to(qAnsS, { duration: 0.2, scale: 1 }).to({}, { duration: 1.2 })
            .call(() => { instr.innerText = `Lajur Puluh: ${p1} + ${p2} = ${ansP}`; })
            .to(qAnsP, { duration: 1.0, opacity: 1, color: "#16a34a", scale: 1.2 }).to(qAnsP, { duration: 0.2, scale: 1 }).to({}, { duration: 1.2 })
            .call(() => { instr.innerText = `Jawapan akhir: ${num1} + ${num2} = ${num1 + num2}`; }).to({}, { duration: 1.4 });
        }
      } else {
        if (s1 < s2) {
          let newP1 = p1 - 1; let newS1 = s1 + 10; let ansS = newS1 - s2; let ansP = newP1 - p2;
          qPInd.innerText = newP1; qSInd.innerText = newS1; qAnsS.innerText = ansS; qAnsP.innerText = ansP;
          tl.call(() => { instr.innerText = `Lajur Sa: ${s1} kecil dari ${s2}. Tak boleh tolak terus!`; })
            .to({}, { duration: 1.4 }).to(qP, { duration: 0.8, color: "#ef4444" })
            .call(() => { instr.innerText = `Kita PINJAM 1 dari Puluh (${p1} jadi ${newP1}).`; })
            .to(qP, { duration: 0.5, onStart: () => qP.classList.add('strike') }).to(qPInd, { duration: 0.8, opacity: 1, y: 5 }).to({}, { duration: 1.0 })
            .call(() => { instr.innerText = `1 yang dipinjam jadi 10, digabung dgn ${s1} = ${newS1}.`; })
            .to(qS, { duration: 0.8, color: "#ef4444" }).to(qS, { duration: 0.5, onStart: () => qS.classList.add('strike') }).to(qSInd, { duration: 0.8, opacity: 1, y: 5 }).to({}, { duration: 1.2 })
            .call(() => { instr.innerText = `Kira: ${newS1} - ${s2} = ${ansS}`; })
            .to(qAnsS, { duration: 1.0, opacity: 1, color: "#16a34a", scale: 1.2 }).to(qAnsS, { duration: 0.2, scale: 1 }).to({}, { duration: 1.2 })
            .call(() => { instr.innerText = `Kira: ${newP1} - ${p2} = ${ansP}`; })
            .to(qAnsP, { duration: 1.0, opacity: 1, color: "#16a34a", scale: 1.2 }).to(qAnsP, { duration: 0.2, scale: 1 }).to({}, { duration: 1.2 })
            .call(() => { instr.innerText = `Jawapan akhir: ${num1} - ${num2} = ${num1 - num2}`; }).to({}, { duration: 1.4 });
        } else {
          let ansS = s1 - s2; let ansP = p1 - p2; qAnsS.innerText = ansS; qAnsP.innerText = ansP;
          tl.call(() => { instr.innerText = `Lajur Sa: ${s1} lebih besar dari ${s2}. Boleh tolak terus!`; })
            .to({}, { duration: 1.4 })
            .call(() => { instr.innerText = `Kira: ${s1} - ${s2} = ${ansS}`; })
            .to(qAnsS, { duration: 1.0, opacity: 1, color: "#16a34a", scale: 1.2 }).to(qAnsS, { duration: 0.2, scale: 1 }).to({}, { duration: 1.2 })
            .call(() => { instr.innerText = `Kira: ${p1} - ${p2} = ${ansP}`; })
            .to(qAnsP, { duration: 1.0, opacity: 1, color: "#16a34a", scale: 1.2 }).to(qAnsP, { duration: 0.2, scale: 1 }).to({}, { duration: 1.2 })
            .call(() => { instr.innerText = `Jawapan akhir: ${num1} - ${num2} = ${num1 - num2}`; }).to({}, { duration: 1.4 });
        }
      }
    }

    function exitQuiz() {
      document.getElementById('quiz-section').style.display = "none";
      goHome();
    }

    function showResults() {
      document.getElementById('quiz-section').style.display = "none";
      document.getElementById('result-section').style.display = "block";
      document.getElementById('title').innerText = "Keputusan Final!";
      let percentage = (score / totalQuestions) * 100;
      document.getElementById('final-percentage').innerText = `${percentage}%`;
      let starDisplay = document.getElementById('star-display');
      let msg = document.getElementById('final-msg');
      if (percentage === 100) {
        starDisplay.innerText = "⭐⭐⭐";
        msg.innerText = `PERFECT 100%! ${playerName} GENIUS MATEMATIK! 🏆`;
      } else if (percentage >= 70) {
        starDisplay.innerText = "⭐⭐☆";
        msg.innerText = `Bagus sangat ${playerName}! Sikit lagi nak dapat 100%! 👍`;
      } else {
        starDisplay.innerText = "⭐☆☆";
        msg.innerText = `Teruskan latihan ${playerName}, pasti boleh dapat 100%! 💪`;
      }
    }

    function goHome() {
      document.getElementById('result-section').style.display = "none";
      document.getElementById('quiz-section').style.display = "none";
      document.getElementById('demo-section').style.display = "none";
      document.getElementById('title').innerText = "Detektif Matematik! 🔍";
      document.getElementById('instruction').innerText = "Masukkan nama & pilih mod permainan:";
      document.getElementById('instruction').style.display = "block";
      document.getElementById('mode-menu').style.display = "block";
      document.getElementById('skip-btn').style.display = "block";
    }
  </script>
</body>
</html>
